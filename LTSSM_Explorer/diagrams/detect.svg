nt.querySelectorAll('path[id^="L_"]'));var el2=Array.from(document.querySelectorAll('g.edgeLabel'));ep.forEach(function(e,i){var m=e.id.match(/^L_([A-Z0-9]+)_([A-Z0-9]+)_\d+$/i);if(m){var f=am[m[1].toUpperCase()];var t=am[m[2].toUpperCase()];if(f)e.setAttribute('data-from',f);if(t)e.setAttribute('data-to',t);}e.classList.add('state-edge');if(el2[i]){var lid='lbl-'+e.id;el2[i].setAttribute('id',lid);el2[i].classList.add('state-edge-label');e.setAttribute('data-label-id',lid);}});}function clearFocus(){document.querySelectorAll('.state-node,.state-edge,.state-edge-label').forEach(function(el){el.classList.remove('dim','focus-node','focus-edge','focus-label');});}function applyFocus(sn){clearFocus();var ns=document.querySelectorAll('.state-node'),es=document.querySelectorAll('.state-edge'),ls=document.querySelectorAll('.state-edge-label');ns.forEach(function(n){n.classList.add('dim');});es.forEach(function(e){e.classList.add('dim');});ls.forEach(function(l){l.classList.add('dim');});var an=document.querySelector('.state-node[data-state="'+sn+'"]');if(an){an.classList.remove('dim');an.classList.add('focus-node');}var dests=new Set();es.forEach(function(e){if(e.getAttribute('data-from')!==sn)return;e.classList.remove('dim');e.classList.add('focus-edge');var t=e.getAttribute('data-to');if(t)dests.add(t);var lid=e.getAttribute('data-label-id');if(lid){var lbl=document.getElementById(lid);if(lbl){lbl.classList.remove('dim');lbl.classList.add('focus-label');}}});dests.forEach(function(d){var dn=document.querySelector('.state-node[data-state="'+d+'"]');if(dn){dn.classList.remove('dim');dn.classList.add('focus-node');}});}function selectState(sn){applyFocus(sn);if(window.parent)window.parent.postMessage({type:'ltssm-node-click',section:section,state:sn},'*');}window.addEventListener('message',function(ev){var d=ev.data;if(!d||d.type!=='ltssm-clear-focus'||d.section!==section)return;clearFocus();});if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}})();]]></script></defs><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="container_flowchart-v2-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="container_flowchart-v2-pointStart"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="container_flowchart-v2-circleEnd"><circle style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" r="5" cy="5" cx="5"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="container_flowchart-v2-circleStart"><circle style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" r="5" cy="5" cx="5"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5.2" refX="12" viewBox="0 0 11 11" class="marker cross flowchart-v2" id="container_flowchart-v2-crossEnd"><path style="stroke-width: 2; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 1,1 l 9,9 M 10,1 l -9,9"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5.2" refX="-1" viewBox="0 0 11 11" class="marker cross flowchart-v2" id="container_flowchart-v2-crossStart"><path style="stroke-width: 2; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 1,1 l 9,9 M 10,1 l -9,9"/></marker><g class="root"><g class="clusters"><g data-look="classic" id="DET" class="cluster"><rect height="256